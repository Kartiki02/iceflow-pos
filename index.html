<!DOCTYPE html>
<html>
<head>
    <title>IceFlow POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #667eea; min-height: 100vh; }
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 10px; width: 350px; }
        .login-box h1 { text-align: center; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .login-box button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .app-screen { display: none; }
        .app-screen.show { display: block; }
        .header { background: #667eea; color: white; padding: 15px; display: flex; justify-content: space-between; }
        .header-right { display: flex; gap: 10px; }
        .header-right button { padding: 8px 15px; background: rgba(255,255,255,0.2); color: white; border: none; cursor: pointer; border-radius: 5px; }
        .header-right button.active { background: white; color: #667eea; }
        .content { padding: 20px; background: #f5f7fa; height: calc(100vh - 50px); overflow-y: auto; }
        .section { display: none; }
        .section.show { display: block; }

        .pos-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; }
        .card h2 { margin-bottom: 15px; font-size: 16px; }

        .menu-cats { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .menu-cats button { padding: 8px 12px; background: #ecf0f1; border: none; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .menu-cats button.active { background: #667eea; color: white; }

        .menu-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .menu-item { background: #667eea; color: white; padding: 12px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .menu-item:hover { background: #764ba2; }

        .order-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .order-slot { padding: 15px; background: #ecf0f1; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .order-slot.active { background: #667eea; color: white; }

        .cart-item { background: #f0f0f0; padding: 10px; border-radius: 5px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 12px; }
        .cart-total { font-size: 18px; font-weight: bold; color: #27ae60; margin: 15px 0; padding: 10px; background: #d5f4e6; border-radius: 5px; }

        .btn { padding: 10px 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; margin: 5px; }
        .btn-danger { background: #e74c3c; }
        .btn-success { background: #27ae60; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; font-weight: bold; }

        .stat-box { background: #667eea; color: white; padding: 20px; text-align: center; border-radius: 6px; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; margin-top: 5px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; min-width: 400px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login" class="login-screen">
        <div class="login-box">
            <h1>🍦 IceFlow</h1>
            <input id="shopInput" type="text" value="Demo Ice Cream" placeholder="Shop">
            <input id="keyInput" type="password" value="DEMO2024SECURE123" placeholder="Key">
            <button onclick="LOGIN()">Login</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app" class="app-screen">
        <div class="header">
            <div>🍦 IceFlow - <span id="shopName"></span></div>
            <div class="header-right">
                <button class="active" onclick="SHOW_TAB('pos')">POS</button>
                <button onclick="SHOW_TAB('admin')">Admin</button>
                <button onclick="SHOW_TAB('reports')">Reports</button>
                <button onclick="LOGOUT()" style="background: #e74c3c;">Logout</button>
            </div>
        </div>

        <div class="content">
            <!-- POS TAB -->
            <div id="pos" class="section show">
                <div class="pos-grid">
                    <div class="card">
                        <h2>Menu</h2>
                        <div class="menu-cats" id="catButtons"></div>
                        <div class="menu-items" id="menuItems"></div>
                    </div>
                    <div class="card">
                        <h2>Orders</h2>
                        <div class="order-slots" id="orderSlots"></div>
                    </div>
                    <div class="card">
                        <h2>Cart</h2>
                        <div id="cartDisplay"></div>
                        <div class="cart-total" id="cartTotal">₹0</div>
                        <button class="btn btn-success" onclick="CHECKOUT()">Checkout</button>
                        <button class="btn" onclick="CLEAR_CART()">Clear</button>
                    </div>
                </div>
            </div>

            <!-- ADMIN TAB -->
            <div id="admin" class="section">
                <button class="btn" onclick="ADD_CAT_MODAL()">+ Category</button>
                <button class="btn" onclick="ADD_ITEM_MODAL()">+ Item</button>
                <div class="pos-grid" style="margin-top: 20px;">
                    <div class="card">
                        <h2>Categories</h2>
                        <table id="catTable"></table>
                    </div>
                    <div class="card" style="grid-column: 2/4;">
                        <h2>Inventory</h2>
                        <table id="invTable"></table>
                    </div>
                </div>
            </div>

            <!-- REPORTS TAB -->
            <div id="reports" class="section">
                <div class="card">
                    <h2>Sales Reports</h2>
                    <button class="btn" onclick="REPORT_PERIOD('today')">Today</button>
                    <button class="btn" onclick="REPORT_PERIOD('weekly')">Weekly</button>
                    <button class="btn" onclick="REPORT_PERIOD('monthly')">Monthly</button>
                    <button class="btn" onclick="REPORT_PERIOD('yearly')">Yearly</button>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-value">₹<span id="rptSales">0</span></div>
                            <div class="stat-label">Total Sales</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value"><span id="rptOrders">0</span></div>
                            <div class="stat-label">Orders</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">₹<span id="rptCash">0</span></div>
                            <div class="stat-label">Cash</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">₹<span id="rptOnline">0</span></div>
                            <div class="stat-label">Online</div>
                        </div>
                    </div>
                    <h3>Orders</h3>
                    <table id="rptTable"></table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <h2>Checkout</h2>
            <p>Total: ₹<span id="chkTotal">0</span></p>
            <p>Discount %: <input id="chkDisc" type="number" value="0"></p>
            <p>Final: ₹<span id="chkFinal">0</span></p>
            <p>Payment: <select id="chkMethod"><option>Cash</option><option>Online</option></select></p>
            <p>Customer: <input id="chkCustomer" type="text"></p>
            <button class="btn btn-success" onclick="FINISH_CHECKOUT()">Complete</button>
            <button class="btn btn-danger" onclick="CLOSE_MODAL('checkoutModal')">Cancel</button>
        </div>
    </div>

    <div id="catModal" class="modal">
        <div class="modal-content">
            <h2>Add Category</h2>
            <input id="catModalName" type="text" placeholder="Category name">
            <button class="btn btn-success" onclick="SAVE_CAT()">Save</button>
            <button class="btn btn-danger" onclick="CLOSE_MODAL('catModal')">Cancel</button>
        </div>
    </div>

    <div id="itemModal" class="modal">
        <div class="modal-content">
            <h2 id="itemModalTitle">Add Item</h2>
            <input id="itemModalName" type="text" placeholder="Item name">
            <select id="itemModalCat"></select>
            <input id="itemModalPrice" type="number" placeholder="Price">
            <input id="itemModalStock" type="number" placeholder="Stock">
            <button class="btn btn-success" onclick="SAVE_ITEM()">Save</button>
            <button class="btn btn-danger" onclick="CLOSE_MODAL('itemModal')">Cancel</button>
        </div>
    </div>

    <script>
        const LICENSES = { 'DEMO2024SECURE123': 'Demo Ice Cream' };

        let DB = {
            shop: '',
            cats: ['ice-cream', 'toppings', 'combos', 'beverages'],
            items: [
                {id:1, name:'Vanilla', cat:'ice-cream', price:80, stock:50, icon:'🍦'},
                {id:2, name:'Chocolate', cat:'ice-cream', price:80, stock:40, icon:'🍫'},
                {id:3, name:'Strawberry', cat:'ice-cream', price:80, stock:35, icon:'🍓'},
                {id:4, name:'Double Scoop', cat:'combos', price:150, stock:999, icon:'🍦'},
                {id:5, name:'Chips', cat:'toppings', price:20, stock:100, icon:'🍫'},
                {id:6, name:'Sprinkles', cat:'toppings', price:15, stock:120, icon:'✨'},
                {id:7, name:'Coffee', cat:'beverages', price:60, stock:40, icon:'☕'}
            ],
            orders: [],
            carts: [[],[],[],[]],
            currentCart: 0,
            currentCat: 'all',
            period: 'today'
        };

        let EDIT_ID = null;

        function LOGIN() {
            const shop = document.getElementById('shopInput').value;
            const key = document.getElementById('keyInput').value;
            if (LICENSES[key] === shop) {
                DB.shop = shop;
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').classList.add('show');
                document.getElementById('shopName').textContent = shop;
                LOAD();
                RENDER_ALL();
            }
        }

        function RENDER_ALL() {
            RENDER_CATS();
            RENDER_MENU();
            RENDER_SLOTS();
            RENDER_CART();
            RENDER_CAT_TABLE();
            RENDER_INV_TABLE();
            UPDATE_CAT_SELECT();
        }

        function RENDER_CATS() {
            let html = '<button class="' + (DB.currentCat === 'all' ? 'active' : '') + '" onclick="SET_CAT(\'all\')">All</button>';
            for (let c of DB.cats) {
                html += '<button class="' + (DB.currentCat === c ? 'active' : '') + '" onclick="SET_CAT(\'' + c + '\')">' + c + '</button>';
            }
            document.getElementById('catButtons').innerHTML = html;
        }

        function SET_CAT(c) {
            DB.currentCat = c;
            RENDER_MENU();
            RENDER_CATS();
        }

        function RENDER_MENU() {
            let items = DB.currentCat === 'all' ? DB.items : DB.items.filter(i => i.cat === DB.currentCat);
            let html = '';
            for (let i of items) {
                html += '<div class="menu-item" onclick="ADD_ITEM(' + i.id + ')">' + i.icon + '<br>' + i.name + '<br>₹' + i.price + '</div>';
            }
            document.getElementById('menuItems').innerHTML = html;
        }

        function ADD_ITEM(id) {
            let item = DB.items.find(i => i.id === id);
            if (!item) return;
            let existing = DB.carts[DB.currentCart].find(i => i.id === id);
            if (existing) existing.qty++;
            else DB.carts[DB.currentCart].push({...item, qty: 1});
            RENDER_CART();
        }

        function RENDER_CART() {
            let cart = DB.carts[DB.currentCart];
            let html = '';
            for (let i of cart) {
                html += '<div class="cart-item"><div>' + i.name + ' x' + i.qty + '</div><div><button class="btn" onclick="UPDATE_QTY(' + i.id + ',-1)">−</button><button class="btn" onclick="UPDATE_QTY(' + i.id + ',1)">+</button></div></div>';
            }
            document.getElementById('cartDisplay').innerHTML = html || 'Empty';
            let total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            document.getElementById('cartTotal').textContent = '₹' + total;
            RENDER_SLOTS();
        }

        function UPDATE_QTY(id, change) {
            let item = DB.carts[DB.currentCart].find(i => i.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) DB.carts[DB.currentCart] = DB.carts[DB.currentCart].filter(i => i.id !== id);
                RENDER_CART();
            }
        }

        function CLEAR_CART() {
            DB.carts[DB.currentCart] = [];
            RENDER_CART();
        }

        function RENDER_SLOTS() {
            let html = '';
            for (let i = 0; i < 4; i++) {
                html += '<button class="order-slot ' + (DB.currentCart === i ? 'active' : '') + '" onclick="SET_SLOT(' + i + ')">Order ' + (i+1) + '<br>(' + DB.carts[i].length + ')</button>';
            }
            document.getElementById('orderSlots').innerHTML = html;
        }

        function SET_SLOT(i) {
            DB.currentCart = i;
            RENDER_CART();
        }

        function CHECKOUT() {
            let total = DB.carts[DB.currentCart].reduce((s, i) => s + i.price * i.qty, 0);
            if (total === 0) return;
            document.getElementById('chkTotal').textContent = total;
            document.getElementById('chkFinal').textContent = total;
            document.getElementById('checkoutModal').classList.add('show');
        }

        function FINISH_CHECKOUT() {
            let cart = DB.carts[DB.currentCart];
            let sub = cart.reduce((s, i) => s + i.price * i.qty, 0);
            let disc = parseFloat(document.getElementById('chkDisc').value) || 0;
            let total = sub - (sub * disc / 100);

            // REDUCE INVENTORY
            for (let i of cart) {
                let item = DB.items.find(x => x.id === i.id);
                if (item) item.stock -= i.qty;
            }

            DB.orders.push({
                id: 'ORD-' + Date.now(),
                date: new Date().toISOString(),
                items: JSON.parse(JSON.stringify(cart)),
                total: total,
                method: document.getElementById('chkMethod').value,
                customer: document.getElementById('chkCustomer').value || 'Walk-in'
            });

            SAVE();
            DB.carts[DB.currentCart] = [];
            RENDER_CART();
            RENDER_INV_TABLE();
            CLOSE_MODAL('checkoutModal');
            alert('Order complete! Inventory reduced.');
        }

        function RENDER_CAT_TABLE() {
            let html = '<tr><th>Category</th><th>Items</th><th>Action</th></tr>';
            for (let c of DB.cats) {
                let count = DB.items.filter(i => i.cat === c).length;
                html += '<tr><td>' + c + '</td><td>' + count + '</td><td><button class="btn btn-danger" onclick="DEL_CAT(\'' + c + '\')">Delete</button></td></tr>';
            }
            document.getElementById('catTable').innerHTML = html;
        }

        function RENDER_INV_TABLE() {
            let html = '<tr><th>Item</th><th>Price</th><th>Stock</th><th>Action</th></tr>';
            for (let i of DB.items) {
                html += '<tr><td>' + i.icon + ' ' + i.name + '</td><td>₹' + i.price + '</td><td>' + i.stock + '</td><td><button class="btn" onclick="EDIT_ITEM(' + i.id + ')">Edit</button><button class="btn btn-danger" onclick="DEL_ITEM(' + i.id + ')">Delete</button></td></tr>';
            }
            document.getElementById('invTable').innerHTML = html;
        }

        function ADD_CAT_MODAL() {
            document.getElementById('catModalName').value = '';
            document.getElementById('catModal').classList.add('show');
        }

        function SAVE_CAT() {
            let name = document.getElementById('catModalName').value.toLowerCase().trim();
            if (!name || DB.cats.includes(name)) return;
            DB.cats.push(name);
            SAVE();
            RENDER_ALL();
            CLOSE_MODAL('catModal');
        }

        function DEL_CAT(c) {
            if (DB.items.some(i => i.cat === c)) { alert('Category has items'); return; }
            DB.cats = DB.cats.filter(x => x !== c);
            SAVE();
            RENDER_ALL();
        }

        function ADD_ITEM_MODAL() {
            EDIT_ID = null;
            document.getElementById('itemModalTitle').textContent = 'Add Item';
            document.getElementById('itemModalName').value = '';
            document.getElementById('itemModalPrice').value = '';
            document.getElementById('itemModalStock').value = '';
            document.getElementById('itemModal').classList.add('show');
        }

        function EDIT_ITEM(id) {
            let item = DB.items.find(i => i.id === id);
            if (!item) return;
            EDIT_ID = id;
            document.getElementById('itemModalTitle').textContent = 'Edit Item';
            document.getElementById('itemModalName').value = item.name;
            document.getElementById('itemModalCat').value = item.cat;
            document.getElementById('itemModalPrice').value = item.price;
            document.getElementById('itemModalStock').value = item.stock;
            document.getElementById('itemModal').classList.add('show');
        }

        function SAVE_ITEM() {
            let name = document.getElementById('itemModalName').value.trim();
            let cat = document.getElementById('itemModalCat').value;
            let price = parseInt(document.getElementById('itemModalPrice').value);
            let stock = parseInt(document.getElementById('itemModalStock').value);

            if (!name || !price || isNaN(stock)) return;

            if (EDIT_ID) {
                let item = DB.items.find(i => i.id === EDIT_ID);
                if (item) {
                    item.name = name;
                    item.cat = cat;
                    item.price = price;
                    item.stock = stock;
                }
            } else {
                let newId = Math.max(...DB.items.map(i => i.id), 0) + 1;
                DB.items.push({id: newId, name: name, cat: cat, price: price, stock: stock, icon: '📦'});
            }

            SAVE();
            RENDER_ALL();
            CLOSE_MODAL('itemModal');
        }

        function DEL_ITEM(id) {
            DB.items = DB.items.filter(i => i.id !== id);
            SAVE();
            RENDER_ALL();
        }

        function UPDATE_CAT_SELECT() {
            let html = '';
            for (let c of DB.cats) {
                html += '<option value="' + c + '">' + c + '</option>';
            }
            document.getElementById('itemModalCat').innerHTML = html;
        }

        function SHOW_TAB(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('show'));
            document.getElementById(tab).classList.add('show');
            document.querySelectorAll('.header-right button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'reports') RENDER_REPORTS();
        }

        function REPORT_PERIOD(p) {
            DB.period = p;
            RENDER_REPORTS();
        }

        function RENDER_REPORTS() {
            let now = new Date();
            let filtered = DB.orders.filter(o => {
                let d = new Date(o.date);
                if (DB.period === 'today') return d.toDateString() === now.toDateString();
                if (DB.period === 'weekly') return d >= new Date(now - 7*24*60*60*1000);
                if (DB.period === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                if (DB.period === 'yearly') return d.getFullYear() === now.getFullYear();
            });

            let sales = filtered.reduce((s, o) => s + o.total, 0);
            let cash = filtered.filter(o => o.method === 'Cash').reduce((s, o) => s + o.total, 0);
            let online = filtered.filter(o => o.method === 'Online').reduce((s, o) => s + o.total, 0);

            document.getElementById('rptSales').textContent = sales;
            document.getElementById('rptOrders').textContent = filtered.length;
            document.getElementById('rptCash').textContent = cash;
            document.getElementById('rptOnline').textContent = online;

            let html = '<tr><th>Order ID</th><th>Date</th><th>Amount</th><th>Payment</th></tr>';
            for (let o of filtered) {
                html += '<tr><td>' + o.id + '</td><td>' + new Date(o.date).toLocaleDateString() + '</td><td>₹' + o.total + '</td><td>' + o.method + '</td></tr>';
            }
            document.getElementById('rptTable').innerHTML = html;
        }

        function CLOSE_MODAL(id) {
            document.getElementById(id).classList.remove('show');
        }

        function SAVE() {
            localStorage.setItem('iceflow_' + DB.shop, JSON.stringify(DB));
        }

        function LOAD() {
            let data = localStorage.getItem('iceflow_' + DB.shop);
            if (data) DB = JSON.parse(data);
        }

        function LOGOUT() {
            document.getElementById('app').classList.remove('show');
            document.getElementById('login').style.display = 'flex';
            DB = {shop:'', cats:['ice-cream','toppings','combos','beverages'], items:[], orders:[], carts:[[],[],[],[]], currentCart:0, currentCat:'all', period:'today'};
        }
    </script>
</body>
</html>
